[project]
name = "mms"
version = "0.1.0"
description = "Maintenance Management System"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.32",
  "pydantic>=2.8.2",
  "python-dateutil>=2.9.0",
  "openpyxl>=3.1.5"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.2"
]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
